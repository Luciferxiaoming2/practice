name: CI

on:
  push:
    branches: [master, main, one]
  pull_request:
    branches: [master, main, one]

jobs:
  # ── Web 前端检查 ─────────────────────────────────────
  web-check:
    name: Web - Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint

  web-build:
    name: Web - Build
    runs-on: ubuntu-latest
    needs: web-check
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build Next.js
        run: npx next build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.example.com' }}
          NEXT_PUBLIC_AMAP_KEY: ${{ vars.NEXT_PUBLIC_AMAP_KEY || '' }}

  # ── 后端检查 ─────────────────────────────────────────
  backend-check:
    name: Backend - Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Check imports
        run: python -c "from app.main import app; print('OK')"

      - name: Run tests
        run: pytest -v --tb=short
